#
# Why the header is that emphatic: a second file carrying the same thresholds
# is a second authority, and the failure mode is that nobody says which wins
# until they disagree — which is exactly the §1 defect this project just spent
# a night removing from its own alignment doc. Stating precedence now, while
# the two agree, costs nothing. Stating it later is an adjudication.
#
# NO CI READS THIS YET, DELIBERATELY. A test that could disagree with the
# document during its amendment window would force an adjudication that is
# itself an amendment. The test lands after 2026-08-17 21:35Z, at which point
# it is ~20 lines because this transcription already exists.
