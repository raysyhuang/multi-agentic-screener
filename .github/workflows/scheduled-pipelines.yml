name: Scheduled Pipelines (GitHub-hosted)

# Runs the pipeline jobs that used to live on the Heroku `worker` dyno's
# APScheduler (see src/worker.py). Each job invokes the worker's existing
# one-off flags (--run-now / --check-now), which run a single pipeline and
# exit — exactly what a CI cron needs.
#
# The evening cross-engine collection and weekly meta-review jobs were removed
# with the cross-engine and LLM subsystems (2026-07 lean strip) — only the
# morning pipeline and afternoon position check remain.
#
# DST handling: GitHub Actions cron is UTC-only and cannot follow US/Eastern
# across daylight-saving changes. For each logical job we register TWO cron
# lines — one at the EDT (UTC-4) offset and one at the EST (UTC-5) offset — and
# a guard step below runs a line only when its offset matches the CURRENT
# Eastern timezone (EDT vs EST). Zone-matching is delay-proof: GitHub routinely
# fires crons 1-2h late, and the previous exact-hour guard silently skipped
# every late run (all four 2026-07-21 slots were skipped this way — only the
# Heroku parallel worker actually ran that day). Net effect: exactly one line
# per slot matches year-round, and it runs whenever GitHub gets around to it.
#
# NOTE: scheduled workflows only fire from the repository's DEFAULT branch, so
# this file must be merged to `main` before the crons take effect. Until then,
# use the "Run workflow" button (workflow_dispatch) to test any job manually.

on:
  schedule:
    # Morning pipeline — 06:17 ET Mon-Fri   (EDT 10:17 UTC / EST 11:17 UTC)
    # Minute 17 deliberately avoids GitHub's congested top-of-hour scheduler.
    # The old :00 pair arrived 10–11 hours late on 2026-08-27/28, after the
    # premarket authority gate had already failed closed.
    - cron: "17 10 * * 1-5"
    - cron: "17 11 * * 1-5"
    # Afternoon position check — 16:30 ET Mon-Fri   (EDT 20:30 UTC / EST 21:30 UTC)
    - cron: "30 20 * * 1-5"
    - cron: "30 21 * * 1-5"
  repository_dispatch:
    types: [mas-morning-fallback]
  workflow_dispatch:
    inputs:
      pipeline:
        description: "Which pipeline to run"
        required: true
        default: "morning"
        type: choice
        options:
          - morning
          - afternoon

concurrency:
  # Serialize all lanes. The completed-peer guard can then suppress whichever
  # of cron/fallback arrives second without a symmetric in-progress race.
  group: mas-scheduled-pipelines
  cancel-in-progress: false

jobs:
  run-pipeline:
    name: Run scheduled pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name != 'repository_dispatch' || github.actor == 'raysyhuang'
    permissions:
      actions: read
      contents: read
    outputs:
      # Whether the pipeline actually ran (vs a DST-guard skip on the duplicate
      # cron line) — gates the dashboard publish so Pages deploys once per slot.
      ran: ${{ steps.resolve.outputs.run }}
      # Attestation read from the database inside the workflow, where it is
      # reachable. External health checks (the VPS mirror) cannot query Neon and
      # the dashboard snapshot exports DailyRun health but not per-run
      # artifacts, so without this they can only infer health from a green
      # conclusion — which has been green on a broken run twice.
      run_id: ${{ steps.attest.outputs.run_id }}
      attested: ${{ steps.attest.outputs.attested }}
      governance_status: ${{ steps.attest.outputs.governance_status }}
      final_output_status: ${{ steps.attest.outputs.final_output_status }}
    env:
      # Read-only Actions API access for cron/fallback completed-peer dedupe.
      GH_TOKEN: ${{ github.token }}
      # --- Database (external managed Postgres — replaces Heroku Postgres) ---
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # --- Telegram alerts ---
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # Label GitHub-run alerts distinctly from Heroku's ([MAS]) during the
      # parallel-run window. Override via repo variable TELEGRAM_ALERT_PREFIX.
      TELEGRAM_ALERT_PREFIX: ${{ vars.TELEGRAM_ALERT_PREFIX || 'MAS-GH' }}
      # --- Market data providers (quant_only needs at least one) ---
      FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
      POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
      FINANCIAL_DATASETS_API_KEY: ${{ secrets.FINANCIAL_DATASETS_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      # --- Misc ---
      API_SECRET_KEY: ${{ secrets.API_SECRET_KEY }}
      EXECUTION_MODE: ${{ vars.EXECUTION_MODE || 'quant_only' }}
      # PEAD paper trial: enabled in production only (code default is off so
      # local/test runs stay deterministic). Quarantined paper stream — tracked,
      # never executed or counted in the book. Set repo var PEAD_ENABLED=false to halt.
      PEAD_ENABLED: ${{ vars.PEAD_ENABLED || 'true' }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: pip install -e .

      - name: Resolve pipeline & DST guard
        id: resolve
        env:
          CLIENT_PAYLOAD_JSON: ${{ toJSON(github.event.client_payload) }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            PIPELINE="morning"
            RUN="true"
            PAYLOAD_KEYS=$(jq -r 'keys | sort | join(",")' <<< "$CLIENT_PAYLOAD_JSON")
            if [ "$PAYLOAD_KEYS" != "expected_date,expected_sha" ]; then
              echo "::error::Fallback payload schema mismatch"
              exit 1
            fi
            EXPECTED_DATE=$(jq -er '.expected_date | select(type == "string")' <<< "$CLIENT_PAYLOAD_JSON")
            EXPECTED_SHA=$(jq -er '.expected_sha | select(type == "string")' <<< "$CLIENT_PAYLOAD_JSON")
            if ! [[ "$EXPECTED_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "::error::Fallback expected_date is not ISO date shaped"
              exit 1
            fi
            if ! [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Fallback expected_sha is not a lowercase 40-hex SHA"
              exit 1
            fi
            ACTUAL_DATE=$(TZ=America/New_York date +%F)
            ET_HOUR=$(TZ=America/New_York date +%H)
            ET_MINUTE=$(TZ=America/New_York date +%M)
            ET_CLOCK_MINUTE=$((10#$ET_HOUR * 60 + 10#$ET_MINUTE))
            if (( ET_CLOCK_MINUTE < 387 || ET_CLOCK_MINUTE >= 540 )); then
              echo "::error::Fallback arrived outside governed 06:27-09:00 ET window"
              exit 1
            fi
            if [ "$EXPECTED_DATE" != "$ACTUAL_DATE" ]; then
              echo "::error::Fallback ET date mismatch: expected=$EXPECTED_DATE actual=$ACTUAL_DATE"
              exit 1
            fi
            if [ "$EXPECTED_SHA" != "$GITHUB_SHA" ]; then
              echo "::error::Fallback SHA mismatch: requested=$EXPECTED_SHA actual=$GITHUB_SHA"
              exit 1
            fi
            echo "MAS_FALLBACK_EXPECTED_DATE=$EXPECTED_DATE" >> "$GITHUB_ENV"
            echo "Governed cron fallback: pipeline=morning ET_date=$ACTUAL_DATE sha=${GITHUB_SHA:0:12}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PIPELINE="${{ github.event.inputs.pipeline }}"
            RUN="true"
            echo "Manual dispatch: pipeline=$PIPELINE"
          else
            SCHED="${{ github.event.schedule }}"
            # Each schedule line is tied to the timezone offset it was written
            # for; it runs iff Eastern time is CURRENTLY in that offset. This is
            # delay-proof (GitHub fires crons 1-2h late routinely) — unlike
            # exact-hour matching, which silently skipped every late run.
            case "$SCHED" in
              "17 10 * * 1-5") PIPELINE="morning";   LINE_ZONE="EDT" ;;
              "17 11 * * 1-5") PIPELINE="morning";   LINE_ZONE="EST" ;;
              "30 20 * * 1-5") PIPELINE="afternoon"; LINE_ZONE="EDT" ;;
              "30 21 * * 1-5") PIPELINE="afternoon"; LINE_ZONE="EST" ;;
              *) echo "::error::Unknown schedule '$SCHED'"; exit 1 ;;
            esac
            CUR_ZONE=$(TZ=America/New_York date +%Z)
            RUN="true"
            [ "$CUR_ZONE" != "$LINE_ZONE" ] && RUN="false"
            echo "schedule='$SCHED' pipeline=$PIPELINE line_zone=$LINE_ZONE current_zone=$CUR_ZONE -> run=$RUN"
            if [ "$RUN" != "true" ]; then
              echo "::notice::Skipping — this cron line is the $LINE_ZONE offset; Eastern is currently $CUR_ZONE."
            fi
          fi
          case "$PIPELINE" in
            morning)   FLAG="--run-now"   ;;
            afternoon) FLAG="--check-now" ;;
            *) echo "::error::Unknown pipeline '$PIPELINE'"; exit 1 ;;
          esac
          if [ "$RUN" = "true" ] && [ "$PIPELINE" = "morning" ] \
             && { [ "${{ github.event_name }}" = "schedule" ] \
                  || [ "${{ github.event_name }}" = "repository_dispatch" ]; }; then
            SHOULD_RUN=$(python scripts/mas_schedule_fallback.py --workflow-should-run)
            if [ "$SHOULD_RUN" != "true" ]; then
              RUN="false"
              echo "::notice::Skipping — counterpart cron/fallback already completed today's current-main morning worker."
            fi
          fi
          {
            echo "pipeline=$PIPELINE"
            echo "flag=$FLAG"
            echo "run=$RUN"
          } >> "$GITHUB_OUTPUT"

      # Mint the run identity BEFORE anything that can fail. Migrations,
      # init_db(), get_settings() and validate_keys_for_mode() all run ahead of
      # the pipeline, so an id created inside the pipeline does not exist for a
      # run that dies during startup — and the attestation would then have
      # nothing to query. Whoever owns identity must own it first.
      - name: Mint run identity
        id: identity
        if: steps.resolve.outputs.run == 'true'
        run: |
          set -euo pipefail
          RUN_ID="$(openssl rand -hex 6)"
          echo "MAS_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "minted MAS_RUN_ID=$RUN_ID"

      - name: Apply database migrations
        if: steps.resolve.outputs.run == 'true'
        run: alembic upgrade head

      - name: Run ${{ steps.resolve.outputs.pipeline }} pipeline
        if: steps.resolve.outputs.run == 'true'
        run: python -m src.worker ${{ steps.resolve.outputs.flag }}

      # Runs even when the pipeline failed — a fail-closed run still records
      # itself, and that record is precisely what an external health check needs
      # to distinguish "recorded its own failure" from "vanished".
      - name: Attest the run recorded itself
        id: attest
        if: ${{ always() && steps.resolve.outputs.run == 'true' && steps.resolve.outputs.pipeline == 'morning' }}
        env:
          OUT: ${{ runner.temp }}/mas-attestation.json
          RUN_ID: ${{ steps.identity.outputs.run_id }}
        run: |
          set +e
          python scripts/assert_run_attestation.py --run-id "$RUN_ID" --out "$OUT"
          rc=$?
          # The script writes the attestation itself; this covers the case where
          # it could not run at all (import error, interpreter gone, OOM). An
          # absent artifact and an unhealthy one must not look the same to the
          # mirror. The non-zero exit below then fails the job — the upload step
          # runs under always(), so the fallback still reaches the mirror while
          # the run is correctly marked failed.
          if [ ! -s "$OUT" ]; then
            printf '{"run_id":"%s","attested":false,"healthy":false,' "$RUN_ID" > "$OUT"
            printf '"governance_status":"unknown","final_output_status":"unknown",' >> "$OUT"
            printf '"artifact_stages":[],"db_error":"AttestationScriptFailed",' >> "$OUT"
            printf '"github_run_id":"%s","github_run_attempt":"%s","commit":"%s",' \
              "${GITHUB_RUN_ID:-}" "${GITHUB_RUN_ATTEMPT:-}" "${GITHUB_SHA:-}" >> "$OUT"
            printf '"trigger_event":"%s","fallback_expected_date":%s}' \
              "${GITHUB_EVENT_NAME:-}" \
              "$(if [ -n "${MAS_FALLBACK_EXPECTED_DATE:-}" ]; then printf '"%s"' "$MAS_FALLBACK_EXPECTED_DATE"; else printf 'null'; fi)" >> "$OUT"
            echo "::error::attestation script exited $rc without writing a file; wrote an unhealthy fallback"
          fi
          exit $rc

      # The durable, externally readable half. Job outputs only reach downstream
      # jobs in this workflow — the REST API does not expose them — so the VPS
      # mirror cannot read them at all. An artifact can be listed and downloaded
      # via /repos/{owner}/{repo}/actions/runs/{run_id}/artifacts.
      - name: Upload attestation
        if: ${{ always() && steps.resolve.outputs.run == 'true' && steps.resolve.outputs.pipeline == 'morning' }}
        uses: actions/upload-artifact@v4
        with:
          name: mas-run-attestation
          path: ${{ runner.temp }}/mas-attestation.json
          # error, not warn: a missing attestation is the one outcome the mirror
          # must never see as a successful upload. The step above guarantees a
          # file exists, so reaching this is itself a fault worth failing on.
          if-no-files-found: error
          retention-days: 30

  publish-dashboard:
    name: Publish dashboard to GitHub Pages
    needs: run-pipeline
    if: needs.run-pipeline.outputs.ran == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: mas-pages-deploy
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Needed to fetch SPY/QQQ benchmark bars for the per-trade alpha vs index.
      POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: pip install -e .
      - name: Export dashboard data snapshot
        run: python scripts/export_dashboard_data.py --out dashboard/data.json
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
